[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge-cloud-ide"
version = "0.1.0"
description = "A shared Python workspace with revision control and container execution."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "websockets>=13,<18"]
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pyforge = "pyforge.__main__:main"

[tool.setuptools.packages.find]
include = ["pyforge*"]

[tool.setuptools.package-data]
pyforge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
